# Discord Bot の設定です。
discord:
  # Discord Bot Token を入れます。GitHubには本物のTokenを絶対に載せないでください。
  token: "PUT_DISCORD_BOT_TOKEN_HERE"
  # 認証ボタンを置くDiscordチャンネルIDを入れます。未設定では認証・入場を受け付けません。
  channel-id: ""
  # 認証成功後に歓迎メッセージを投稿するチャンネルIDです。空なら投稿しません。
  # 認証チャンネルと同じサーバー内に置き、Botに閲覧・送信権限を付けてください。
  welcome-channel-id: "1449580988597403651"
  # 認証に成功した人に付けるロールIDです。サーバー内のチャンネルを見られるロールを指定します。
  # 空なら付けません。Botのロールをこのロールより上に置き、「ロールの管理」権限を付けてください。
  verified-role-id: ""

# 認証コードと失敗制限の設定です。
auth:
  # 認証コードの桁数です。プログラム側では4から8桁に制限しています。
  code-length: 4
  # キック画面でコードを区切る桁数です。6桁を3にすると「123 456」と表示します。
  # 均等に分けられない桁数（4桁など）や0のときは区切りません。
  # Discordへ区切ったまま貼り付けても、空白・ハイフン・全角数字は無視して受け付けます。
  code-group-size: 3
  # 認証コードの有効期限です。秒単位です。
  code-expire-seconds: 300
  # Discordでコードを何回間違えたら一時ロックするかです。
  max-invalid-attempts: 5
  # 一時ロックの長さです。秒単位です。
  lockout-seconds: 60

# プレイヤーやDiscordチャンネルに表示するメッセージです。
messages:
  # 未認証プレイヤーをキックするときにMinecraft側へ表示します。
  # {code} は認証コードに置き換わります。
  # {player} はMinecraftプレイヤー名に置き換わります。
  kick: |-
    Discord認証が必要です。
    1. Discordの認証チャンネルで「認証コードを入力」ボタンを押す
    2. 次のコードを入力する: {code}
    3. 認証完了のメッセージが出たら、もう一度接続する
  # Bot起動時に認証チャンネルへ置く、ボタン付き案内の本文です。
  panel: |-
    **Minecraft認証**
    1. Minecraftサーバーに接続すると、認証コードが表示されます
    2. 下の「認証コードを入力」ボタンを押して、そのコードを入力してください
    3. 認証が終わると、Minecraftサーバーに入れるようになり、Discordのチャンネルも見られるようになります
  # 認証成功時に本人だけへ表示します。
  # {player}, {uuid}, {discord} が使えます。
  verified: "{player} として認証できました。Minecraftからもう一度接続してください。"
  # 認証のDB保存に成功した後、歓迎チャンネルへ投稿します。空なら投稿しません。
  # {mention} は認証した本人へのメンションに置き換わります。
  welcome: "{mention} さん、認証が完了しました。ようこそ！"
  # コードが無効または期限切れだったときに本人だけへ表示します。
  invalid-code: "認証コードが合っていないか、期限が切れています。Minecraftに接続し直すと、新しいコードが表示されます。"
  # 間違えすぎて一時ロックされたときに本人だけへ表示します。
  rate-limited: "コードを続けて間違えたため、少しの間入力できません。しばらく待ってから、もう一度お試しください。"
